# DOSBox-X configuration for HCOM <-> MAME (TCP nullmodem)
# =========================================================
# DOSBox-X listens on TCP port 5705. MAME (as bitbanger client)
# connects to it. HCOM.EXE then runs the PC side of the
# Husky file-transfer protocol while the Hunter (in MAME) runs
# the resident HCOM.COM client.
#
# Hunter baud rate: 4800 8N1 (set by FIX-5 null_modem patch).
#
# Working directory when launched: HuskyHCOM/
#   C: = HuskyHCOM/         (contains hcomw/ subdirectory)
#   D: = HuskyHCOM/HSYNC/   (staging folder for file transfers)

[sdl]
fullscreen=false
output=opengl
windowresolution=800x600

[dosbox]
title=HCOM (MAME bridge)
machine=svga_s3
memsize=16

[cpu]
core=auto
cputype=auto
cycles=max

[serial]
# DOSBox-X listens on 127.0.0.1:5705.
# transparent:1 = no telnet IAC negotiation (raw bytes only)
# rxdelay:1000  = wait up to 1s for a peer (avoids race on startup)
serial1=nullmodem port:5705 transparent:1 rxdelay:1000
serial2=dummy
serial3=dummy
serial4=dummy

[dos]
xms=true
ems=true
umb=true

[autoexec]
mount c "."
mount d ".\HSYNC"
@echo off
c:
cd \hcomw\HCOM.DOS
SET PATH=C:\hcomw\HCOM.DOS
echo.
echo  =============================================
echo   HCOM bridge ready.
echo   C: = HuskyHCOM/         D: = HuskyHCOM/HSYNC/
echo.
echo   ORDER MATTERS:
echo    1) In MAME (Hunter): type  HCOM   first
echo    2) Then HERE in DOSBox-X:  type  HCOM
echo.
echo   Use L (change drive) in HCOM to switch to D:
echo   for file transfers into/out of HSYNC/
echo  =============================================
echo.
