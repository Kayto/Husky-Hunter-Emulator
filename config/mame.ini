#
# MAME configuration for Husky Hunter emulator
#
# Hunter native display: 240 x 64 pixels
#

#
# Window / display options
#
window                    1       # 1 = windowed, 0 = fullscreen
maximize                  0       # 0 = open at resolution below, 1 = maximise window

# resolution: WxH -- integer multiples of 240x64 look sharpest
# 2x:  480x128
# 3x:  720x192
# 4x:  960x256   <-- current
# 5x: 1200x320
# 6x: 1440x384
# 0x0 = let MAME choose (will usually fill the screen)
resolution                960x256

keepaspect                1       # 1 = maintain aspect ratio when window is resized
